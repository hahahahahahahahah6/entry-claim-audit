[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entry-claim-audit"
version = "0.1.0"
description = "Offline static audits of Python entry-point claims"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
entry-claim-audit = "entry_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
